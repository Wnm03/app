name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require npm lockfile
        shell: bash
        run: |
          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "CI BLOCKED: package-lock.json or npm-shrinkwrap.json is required"
            exit 1
          fi
      - name: Locked install
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Release-grade check
        run: npm run check
