name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require npm lockfile
        shell: bash
        run: |
          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "CI BLOCKED: package-lock.json or npm-shrinkwrap.json is required"
            exit 1
          fi
      - name: Locked install
        run: npm ci --include=optional
      - name: Ensure native esbuild runtime
        run: npm install --no-save --package-lock=false --include=optional @esbuild/linux-x64@0.24.0
      - name: Verify esbuild native runtime
        run: |
          node - <<'NODE'
          const esbuild = require('esbuild');
          const result = esbuild.transformSync('const answer = 1 + 2;', { minify: true });
          if (!result.code) throw new Error('esbuild native transform returned empty output');
          console.log(`esbuild ${esbuild.version}: native runtime PASS`);
          NODE
      - name: Release-grade check
        run: npm run check
