plugins { id 'com.android.application' }

android {
    namespace 'id.kwarga.w'
    compileSdk 35
    defaultConfig {
        applicationId 'id.kwarga.w'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    signingConfigs {
        release {
            if (project.hasProperty('W_KEYSTORE_FILE')) {
                storeFile file(project.property('W_KEYSTORE_FILE'))
                storePassword project.property('W_KEYSTORE_PASSWORD')
                keyAlias 'w'
                keyPassword project.property('W_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
